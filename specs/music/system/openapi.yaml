            "type": "string",
            "format": "uri",
            "maxLength": 2000
          },
          "license_name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 120
          },
          "license_url": {
            "type": "string",
            "format": "uri",
            "maxLength": 2000
          }
        },
        "required": [
          "id",
          "title",
          "artist",
          "album",
          "duration_ms",
          "tags",
          "playable",
          "stream_url",
          "attribution_text",
          "source_url",
          "license_name",
          "license_url"
        ],
        "additionalProperties": false
      },
