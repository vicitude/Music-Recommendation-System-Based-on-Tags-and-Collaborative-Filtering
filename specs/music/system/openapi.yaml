        "type": "object",
        "properties": {
          "username": {
            "type": "string",
            "pattern": "^[a-z0-9_]{3,30}$"
          },
          "password": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128
          }
        },
        "required": [
          "username",
          "password"
        ],
        "additionalProperties": false
      },
      "InterestRequest": {
        "type": "object",
        "properties": {
          "tag_ids": {
            "type": "array",
            "items": {
              "type": "integer",
              "minimum": 1
            },
            "uniqueItems": true,
            "oneOf": [
              {
                "maxItems": 0
              },
              {
                "minItems": 3,
                "maxItems": 5
              }
            ]
          }
        },
        "required": [
          "tag_ids"
        ],
        "additionalProperties": false
      },
      "Interests": {
        "type": "object",
        "properties": {
          "tag_ids": {
            "type": "array",
            "items": {
              "type": "integer",
              "minimum": 1
            },
            "uniqueItems": true
          },
          "onboarding_completed": {
            "type": "boolean"
          }
        },
        "required": [
          "tag_ids",
          "onboarding_completed"
        ],
        "additionalProperties": false
      },
      "BehaviorRequest": {
        "type": "object",
        "properties": {
          "event_id": {
            "type": "string",
            "format": "uuid"
          },
          "song_id": {
            "type": "integer",
            "minimum": 1
          },
          "listening_session_id": {
            "type": "string",
            "format": "uuid"
          },
          "kind": {
            "type": "string",
            "enum": [
              "PLAY",
              "COMPLETE",
              "SKIP"
            ]
          },
          "position_ms": {
            "type": "integer",
            "minimum": 0,
            "maximum": 86400000
          },
          "listened_ms": {
            "type": "integer",
            "minimum": 0,
            "maximum": 86400000
          }
        },
        "required": [
          "event_id",
          "song_id",
          "listening_session_id",
          "kind",
          "position_ms",
          "listened_ms"
        ],
        "additionalProperties": false
      },
      "BehaviorResponse": {
        "type": "object",
        "properties": {
          "id": {
            "type": "integer",
            "minimum": 1
          },
          "event_id": {
            "type": "string",
            "format": "uuid"
          },
          "effective_ms": {
            "type": "integer",
            "minimum": 0,
            "maximum": 86400000
          }
        },
        "required": [
