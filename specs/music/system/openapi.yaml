      }
    },
    "schemas": {
      "Error": {
        "type": "object",
        "properties": {
          "error_code": {
            "type": "string",
            "enum": [
              "VALIDATION_ERROR",
              "AUTH_REQUIRED",
              "AUTH_FAILED",
              "CSRF_FAILED",
              "PERMISSION_DENIED",
              "NOT_FOUND",
              "USERNAME_TAKEN",
              "EVENT_CONFLICT",
              "INVALID_TRANSITION",
              "LIMIT_REACHED",
              "RATE_LIMITED",
              "MEDIA_UNAVAILABLE",
              "INTERNAL_ERROR"
            ]
          },
          "message": {
            "type": "string",
            "maxLength": 200
          },
          "details": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "request_id": {
            "type": "string",
            "format": "uuid"
          }
        },
        "required": [
          "error_code",
          "message",
          "details",
          "request_id"
        ],
        "additionalProperties": false
      },
      "User": {
        "type": "object",
        "properties": {
          "id": {
            "type": "integer",
            "minimum": 1
          },
          "username": {
            "type": "string",
            "pattern": "^[a-z0-9_]{3,30}$"
          },
          "onboarding_completed": {
            "type": "boolean"
          }
        },
        "required": [
          "id",
          "username",
          "onboarding_completed"
        ],
        "additionalProperties": false
      },
      "Tag": {
        "type": "object",
        "properties": {
          "id": {
            "type": "integer",
            "minimum": 1
          },
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 30
          },
          "kind": {
            "type": "string",
            "enum": [
              "STYLE",
              "MOOD",
              "SCENE"
            ]
          }
        },
        "required": [
          "id",
          "name",
          "kind"
        ],
        "additionalProperties": false
      },
      "Evidence": {
        "type": "object",
        "properties": {
          "tag_ids": {
            "type": "array",
