          "rank",
          "source",
          "content_score",
          "cf_score",
          "score",
          "explanation",
          "evidence"
        ],
        "additionalProperties": false
      },
      "Song": {
        "type": "object",
        "properties": {
          "id": {
            "type": "integer",
            "minimum": 1
          },
          "title": {
            "type": "string",
            "minLength": 1,
            "maxLength": 120
          },
          "artist": {
            "type": "string",
            "minLength": 1,
            "maxLength": 120
          },
          "album": {
            "type": "string",
            "maxLength": 120,
            "default": ""
          },
          "duration_ms": {
            "type": "integer",
            "minimum": 1,
            "maximum": 86400000
          },
          "tags": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Tag"
            }
          },
          "playable": {
            "type": "boolean"
          },
