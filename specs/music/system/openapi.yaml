              }
            }
          }
        },
        "description": "只读返回当前认证用户已接受并持久化的 PLAY 历史；仅 active=true 歌曲，按歌曲取 MAX(occurred_at)，按 last_played_at 降序、song.id 升序。仅允许单值 page，默认 1；每页固定 20，拒绝 page_size 和其他未知参数。空集第一页返回空 items，越界页返回 404；不写行为或刷新推荐。"
